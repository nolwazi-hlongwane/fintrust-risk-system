name: CI

# Unit tests run on every push to any branch.
# Integration tests run on the develop branch only (added in Week 13 Day 2,
# when the first tests that need a PostgreSQL container exist).

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check shell scripts for syntax errors
        run: |
          for script in $(git ls-files '*.sh'); do bash -n "$script"; done

      - name: Unit tests
        run: pytest tests/unit --cov=fintrust --cov-report=term-missing
        env:
          # Fake values: moto intercepts every AWS call, nothing reaches a real account.
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: eu-north-1
